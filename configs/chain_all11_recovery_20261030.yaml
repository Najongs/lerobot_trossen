# ===== 10/30 1호기 판 — 비커 교체 전 정렬 원본 복귀 =====
# 출처: 로봇PC 1호기 공통 설정 outputs/chain_all11_recovery.yaml(2026-10-30 01:48)에서 조작 8단계 정책 경로만 10k로 바꾼 것
#   = 10월 30일 rrun r21(01:54)·r22(02:17)가 실제로 돈 설정 — 회차 이름(repo_id)과 save: false만 rrun 함수가 넣었다
# 10월 26일 시연판(configs/chain_all11_demo_20261026.yaml)과 다른 것은 비커 교체 전 정렬(s7_align) 셋과 정책 경로뿐
#   - 기준 그림: 3° 합성(_cw3deg.png) → 원본(20261026_s8start_task08_ep156.png) — 「시계방향 3도」는 문 연 뒤 틀어진 관찰을 목표 자리로 잘못 읽은 것(10/30 확인)
#   - 순서: s7_align → s7_fwd 를 s7_fwd → s7_align 으로, coarse_heading false → true(원본 기준으로 정렬에 성공한 10/26 회차의 조합)
#   - 시연판은 그날 기록이라 고치지 않았다 — 그 파일의 3° 기준은 쓰지 말 것
# 코드: main 5bf6ae5 + 순차 인코딩 스위치(PR #99 브랜치)에서 돌렸다 — 이 설정 자체는 main의 단계 실행기로 읽힌다
# 실행: repo 루트에서 `uv run python -m stage_runner --config_path configs/chain_all11_recovery_20261030.yaml`
#   repo_id는 r00 자리표시 — 로봇PC 함수(chain·rrun)가 sed로 회차 번호를 넣는다
# ⚠ 기기별 경로 — 줄 끝에 「⚠ 기기별 경로」 표시한 줄은 그 기기에 받은 위치로 바꿀 것
#   policy_path: HF kiroaiseoul/pi0full_bs32_all11_14D_ft1029_s10k — 새 체크포인트가 나오면 이 8줄만 바꾼다
#   completion model_path: DGX /raid/kiro-ai/stage_classifier/20261025_models/<단계>
#   reference_image: repo의 configs/align_refs/ (repo 루트에서 실행할 때 상대경로로 읽힘)
# ⚠ 카메라 시리얼은 1호기 값 — 2호기는 자기 시리얼로, 정렬 기준 화면도 2호기는 아직 1호기 것
# 이 판의 실기 결과(r21·r22, 1호기): 비커 교체 전 정렬 r21 정렬됨(0회 이동) · r22 대략 추정으로 돌다 벌어져 중단 · 선반 앞 정렬 두 회차 모두 추정 불가
# ===== 아래는 원래 머리 주석 =====
# stage_runner — 1~11단계 전체: 이동은 10/25 2차 베이스 데모(replay_base_chain_1025b, 도착을 다음 조작 단계 첫 화면에 맞춤) 재생 + 도착 화면 정렬, 조작은 pi0
# 만든 곳: 로봇PC 세션 70f27ad1 (2026-10-25). 절차: vault-taskintel/_inbox/20261025-전체단계-재생정렬-실행-절차.md
# 이동 단계(base_replay)마다 다음 정책 단계의 start_pose를 먼저 잡는다(임시 패치 preflight.py, 10/25 사용자 요청) — s1←s2 · s3←s4 · s6_move←s7 · s10←s11
#   ⚠ 10/26부터 s4 start_pose는 리커버리 첫 프레임 기준(아래)이라 s3의 사본과 다르다 — s3은 옛 학습 데이터 자세 그대로 둠(팔을 실패 지점 자세로 뻗은 채 베이스가 다가가지 않게). s4 시작 때 그 자리에서 새 자세로 옮긴다
# s4 start_pose = recovery_manipulation_14D에서 그 단계 지시문으로 거른 77개 에피소드 → ep 74의 첫 프레임, 같은 공식(first_frame_nearest_to_median_std_l2, stage_runner.start_pose 함수 재사용). 사용자 10/26 A안 「실패 지점 자세에서 시작」. 원래 대비 관절 최대 차 0.44 rad(오른팔 joint_3). 이전 값 = .bak_20261026_s2s4_startpose_train
#   s2도 같은 방식(ep 18, 최대 차 1.21 rad)으로 바꿨다가 사용자 10/26 「2단계 초기자세 원래대로」로 되돌림 — 지금 s2는 원래 학습 데이터 자세(s1 사본과 같음)
# s6_align yaw_tol_deg 3.5 (사용자 10/25 t06) — 냉장고 앞은 맞는 점이 적어 추정이 ±0.5° 흔들리고 3° 미만 보정 회전이 실제로 거의 안 돈다(t05). 나머지 정렬은 2.0
# 10/26 완료 판별기(이슈 #85 커밋 c5b05ec cherry-pick, 사용자 「단계 판정기 적용해볼 수 있나? 타이머는 전체적으로 여유롭게」) — mode fire, timeout_s는 천장
#   s2·s5·s7·s8·s9·s11 = type classifier, 모델 ~/stage_classifier/20261025_models/<단계>(DGX /raid/kiro-ai/stage_classifier/20261025_models에서 받음), 임계·유지·최소 시간은 각 completion.json. s2만 두 손 쥠 조건(grip 0.004~0.0101 m, 0.5 s)
#   s6 = type grasp(오른손 닫힘 뒤 wait_s 9.1) + 토크 끔. s4 = 타이머 그대로(사용자 「4단계는 타이머 늘리지 말자」)
#   천장 = 아래 타이머의 약 1.5배: s2 32.1→48→25(사용자 10/26 「2단계 타이머 25초」) · s5 15.2→31.3→12→8.5→12.75(8.5의 1.5배, 사용자 10/26 「튜브 버리는 단계 타이머 1.5배」 — r09·r10 실측 — 두 손이 튜브를 놓음 6.0·6.3초, 팔 정지 7.0·8.2초, 그 뒤는 대기. 사용자 「거의 8초면 끝나던데」) · s6 11.5→17→25(r10에서 14.1초에 다시 집어 대기가 처음부터 — 사용자 「아니라고 하면 타이머 더 늘려야」) · s7 25.1→38 · s8 26.3→40 · s9 18.9→28 · s11 17.1→26. 이전 설정 = .bak_20261026_before_classifier
#   ⚠ 실기 미시험 — 판별기가 실패하면 채점만 멈추고 타이머(천장)로 끝난다. 로그 = 단계마다 events.jsonl `stage_completion`
# (판별기 이전) 정책 단계는 타이머(학습 데이터 단계 길이 p95 프레임 ÷ 실측 루프 20 Hz, 10/20 방식). → 누르면 타이머 전에도 넘어감, 중단은 ESC.
#   s2 32.1 (task02_14D) · s4 19.4 (task04) · s5 31.3 (task05) · s7 25.1 · s8 26.3 · s9 18.9 (10/20, all11 병합본) · s11 17.1 (task11_14D)
#   s11 release_base_torque: true (사용자 10/26 「11단계도 꺼줘」 — s6에서 실기 작동 확인 뒤)
#   display_data true (사용자 10/26 「display 켜줄 수 있나 rerun? rrun이랑 chain 모두」) — Rerun 로깅은 non-blocking이라 lerobot-record 정책 모드에서 루프 Hz가 거의 안 변했다(8.5→8.7~9.4, 96-Notes 루프 실주기 계측). ⚠ stage_runner 20 Hz 루프에서 켰을 때 영향은 미측정 — 각 단계 stage_end의 hertz로 확인
#   s7_align (사용자 10/26 「문 열다 돌아가는게 문제」 — 비커 교체 전 보정 한 번 더, 「열린 화면 기준으로」) = 기준 화면 outputs/align_refs/20261026_s8start_task08_ep156.png(task08 데모 251개 중 시작 자세 대표 ep156의 첫 cam_high — 문 열림·냉장고 안 비커), 영역 [233,0,220,200], 방향만: yaw_tol 1.5°, dist_tol 100 cm(거리 이동 안 함 — 문이 열려 화면 크기가 달라 거리 추정이 틀리면 팔·비커를 든 채 냉장고로 다가갈 수 있어서). ⚠ 문 열린 화면이라 맞는 점이 부족하면 보정 없이 넘어감 · 3° 미만 회전이 실제로 덜 도는 문제(t05)는 그대로
#   s7_align 기준을 ep156 화면을 시계방향 3° 돌린 합성 화면(_cw3deg.png)으로 교체(사용자 10/26 「매번은 아니지만 시계방향 3도 정도 틀어져야」) — 순수 회전 호모그래피 K·R(camera_up 축 −3°... 부호는 정렬 알고리즘으로 확인: yaw_between(새 기준, ep156)=+3.02° → 원래 자리면 −3.02° 명령, 양의 명령 = 반시계(10/26 실기 회전 전후 화면이 오른쪽으로 이동)). 원래 ep156 기준 = .bak_20261026_s7align_ep156
#   ⚠ 10/30 s7_align 기준을 ep156 원본(20261026_s8start_task08_ep156.png)으로 복귀 — 위 3° 합성은 「문 연 뒤 시계방향 3°쯤 틀어져 있다」는 관찰을 목표 자리로 잘못 읽어 넣은 것(사용자 10/30). 바꾸기 전 = .bak_20261030_0146_before_s7_original
#   ⚠ 10/30 순서도 s7_fwd → s7_align, coarse_heading true로 복귀 — 원본 기준으로 정렬에 성공한 두 회차(chain_new r03·rrun_new r03)의 조합(사용자 10/30). 바꾸기 전 = .bak_20261030_0151_before_s7_order_revert
#   s7_fwd (사용자 10/26 「비커교체 시작전 5cm 가깝게」) = 1025c 위치 라벨 2104~2131행을 2103행 기준 상대로 재생 — 전진 +5.0 cm·방향 +1.15°(데모 전체에서 정지 출발 5 cm 직진 중 방향 변화가 가장 작은 구간, 선반 앞 마지막 직진 시작부). (10/26 순서 바꿈: s7_align → s7_fwd — 전진 뒤엔 시계 3° 기준과 맞는 점이 14개로 떨어져 방향 추정이 안 됐고(rec r03), 전진의 실제 방향 변화는 −0.4°로 작았다. s7_align은 coarse_heading false — 정밀 추정이 안 되면 돌지 않고 넘어감). 팔은 그대로 유지(start_pose 없음)
#   s8_back (사용자 10/26 「냉장고 문 닫기 전 5cm 멀리」) = 1456~1508행을 1455행 기준 상대로 — 후진 −5.2 cm·방향 −0.33°(1025c 9단계 후진 초입). s8 → s8_back → s9
# 선반 앞 10 cm 뒤 (사용자 10/26 「11단계 보정 위치 10cm 멀리」): s10 재생 끝 until_row 2250 → 2190, s10_align 기준 프레임 2255 → 2190, landmark_distance_m 0.9 → 1.0.
#   1025c 위치 라벨(basepose) 실측 — 2110~2250은 마지막 직진(방향 변화 1° 미만), 2190은 2250보다 x.pos −10.1 cm·방향 +0.65°. 정렬은 오늘 r05에서 맞는 점 4/22로 보정 안 됨이라 재생 끝을 같이 당긴다
#   ⚠ 2190은 데모가 약 5.5 cm/s로 움직이던 행이라 거기서 멈추는 재생은 미시험
#   s5 15.2 (사용자 10/26 「너무 길다」) = task05_tube_disposal(n=74)에서 팔 움직임이 끝나는 프레임 p95 315 ÷ 20.7 Hz — 31.3은 에피소드 길이 p95 625라 끝난 뒤 정지 꼬리(중앙 약 75프레임)까지 셌다. 움직임 끝 = 팔 12관절 속도 노름 5프레임 평균 > 0.002~0.008 rad/프레임의 마지막 프레임(임계 바꿔도 p95 313~316)
#   s6 11.5 + release_base_torque: true (사용자 10/26 「토크 끌 수 있으면 길게, 11.5」 — 이슈 #85 커밋 c4cb748을 eval/recovery에 cherry-pick) — 정책이 내는 베이스 명령은 그 단계 동안 무시된다. ⚠ 토크가 꺼진 동안 바퀴가 풀려 손으로 밀린다
#   (이전) s6 6.0 (사용자 10/26 「흔들기 없게」) = 단계 6 데이터(task06_..._14D)에서 흔들기 시작 프레임 p5 130·p10 136·p50 167(n=256, 오른팔 R2·R3·R4 왕복 시작) ÷ 오늘 chain 실측 루프 20.7 Hz → p5 약 6.3초, 그 앞에서 끊는다. 이전 값 11.5(아래)
#   (이전) s6 11.5 = t01에서 pi0가 11.6초부터 베이스 명령을 냄(그 전까지 |cmd| 0.03 이하) — 그 직전에서 끊는다. 옛 값 14.5 = 단계 6 데이터(task06_..._14D, n=306)에서 베이스가 움직이기 시작하는 프레임 중앙 290 ÷ 20 Hz — 흔들기까지만 돌리고 이동은 s6_move가 맡게
# start_pose 출처: s2 = configs/chain_stage12_align.yaml, s4·s5 = outputs/chain_task45_par_t01.yaml(ACT 체크포인트 기준 생성),
#   s6~s9 = outputs/chain_pi0_s6789_t05.yaml, s11 = stage_runner.start_pose로 10/25 생성(task11_place_beaker_on_the_shelf_14D)
# 정렬 landmark_roi: s1 = dark_blob_box(랙), s3·s6·s10 = 기준 화면을 보고 손으로 잡은 상자. landmark_distance_m: s1 = 10/24 역산 0.60,
#   나머지는 ⚠ 눈대중 추정 — 거리 보정이 멈추는 자리(기준 화면과 같은 크기)는 이 값과 무관, 한 번에 움직이는 양만 비례해 틀린다
# 7단계 앞 리더암 리셋(reset_s7)은 10/26 00:3x 사용자 요청으로 다시 뺌
# 베이스 데모를 3차 replay_base_chain_1025c(10/25 22:25 재녹화)로 교체 — 사용자 10/25. 재생 끝 = 도착 정지가 자리 잡은 행 +5, 정렬 기준 = 그 +5. 냉장고 앞 영역을 탁자 모서리 → 냉장고 몸통(과거 도착 3건 맞는 점 13~17), 기준 거리 s1 0.69·s6 0.85는 새 데모 접근 구간 실측
# 냉장고 앞 정렬 기준 프레임 1390 → 1507(사용자 10/26 「5 cm만 더 멀리서 멈추게」): 1025c 9단계 후진 초입, 1390보다 4.9 cm 뒤·방향 −0.3°, 화면 크기로도 −4.9 cm. 재생은 1385행(데모 거리)까지 그대로, 정렬이 뒤로 물러난다
