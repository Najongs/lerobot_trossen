# stage_runner — 단계 1(랙으로 이동) → 도착 화면 정렬 → 단계 2(튜브 집기) 실행 설정
#
# 10/24 로봇PC에서 셸 스크립트 셋(arrive → align → pi0)으로 돌린 것을
# 한 프로세스 한 에피소드로 묶은 것이다.
#
#   s1        base_replay   데모 에피소드 0의 베이스 위치 라벨을 따라감(행 0~297)
#   s1_align  base_align    cam_high 화면을 데모 도착 화면(에피소드 0 프레임 302)과
#                           비교해 헤딩 먼저, 거리는 랙 크기로 보정
#   s2        lerobot_policy  pi0 단계 2 — 시작 전에 팔을 학습 데이터 대표 자세로
#
# 실행 — 저장소 루트에서(README 3-4와 같은 자리):
#
#   env LEROBOT_CHUNK_PREFETCH_TICKS=12 LEROBOT_CHUNK_RTC=1 LEROBOT_CHUNK_SEAM_BLEND_TICKS=4 \
#     HF_HUB_OFFLINE=1 uv run python -m stage_runner --config_path configs/chain_stage12_align.yaml
#
# 회차마다 바꾸는 것은 dataset.repo_id 하나다. 사용법·이벤트·실패 종류는
# packages/stage_runner/README.md 「베이스 이동 단계 (base_replay · base_align)」가 정본.
#
# ⚠ 두 데이터셋은 로봇PC 로컬에 있어야 한다 — 실행기는 내려받지 않는다.
#   위치 라벨 사본 kiroaiseoul/test_replay_timing_1024_basepose는 허브에 없다
#   (derive_pose.py로 로봇PC에서 만든 것). 기준 화면은
#   kiroaiseoul/test_replay_timing_1024의 영상에서 읽는다.
#
# ⚠ 아래 베이스 단계 문턱값(추종 이탈·정지 판정·이동 실패)은 실기에서 아직 안
#   잰 추정값이다 — 코드 상수(base_stages.py)이고 이 파일엔 없다. 첫 실행 뒤
#   outputs/stage_runner/<run_id>/base/*.csv와 stage_base_* 이벤트로 확인한다.

version: 1

robot:
  type: mobileai_robot
  id: follower
  left_arm_ip_address: 192.168.1.5
  right_arm_ip_address: 192.168.1.4
  enable_base_motor_torque: true  # 필수 — 끄면 베이스가 모든 명령을 조용히 무시한다
                                  # (base 단계 preflight가 거부한다)
  include_base_in_state: false    # pi0full_bs32_s30k_all11_14D는 14-dim state.
                                  # 10/24 pi0 eval도 이 기본값으로 돌았다
  cameras:
    # cam_high = 정렬 단계의 카메라. 회전·색 설정을 바꾸지 말 것 — 렌즈값을
    # 장치에서 읽는데 그 값은 회전 안 한 RGB 스트림에만 맞는다(preflight가 거부)
    cam_high:
      type: intelrealsense
      serial_number_or_name: "230422273501"
      width: 640
      height: 480
      fps: 30
    cam_left_wrist:
      type: intelrealsense
      serial_number_or_name: "230422271234"
      width: 640
      height: 480
      fps: 30
    cam_right_wrist:
      type: intelrealsense
      serial_number_or_name: "230322274369"
      width: 640
      height: 480
      fps: 30

dataset:
  # ⚠ 회차마다 새 이름 — 같은 이름이 있으면 FileExistsError로 죽는다.
  #   정책을 주는 실행이라 `<owner>/eval_`로 시작해야 한다.
  repo_id: kiroaiseoul/eval_chain_stage12_align_t01
  # 21 = 10/24 pi0 단계 2 eval(--dataset.fps=21)과 같은 제어 주기. 베이스
  # 단계도 이 주기로 돌고 기록한다. 재생 목표는 시간으로 보간하므로 실제
  # 루프가 21 Hz보다 느려도 데모 속도는 그대로다.
  fps: 21

defaults:
  executor: lerobot_policy
  manual_ceiling_s: 300.0

output:
  root: outputs/stage_runner

display_data: false

stages:
  - id: s1
    # 베이스 단계의 task 문자열 = name — 그 단계가 기록한 프레임마다 붙는다.
    # 다른 단계의 task 문자열(정책 단계는 instruction)과 같으면 preflight 거부
    name: move_to_tube_rack
    executor: base_replay
    terminator:
      type: timeout
      # 폭주 상한. 하한 = 0.5 + 297/21 + 4 + 2 ≈ 21초(base_assets가 거부)
      timeout_s: 30
    replay:
      dataset: kiroaiseoul/test_replay_timing_1024_basepose
      # root: 생략 = ~/.cache/huggingface/lerobot/<dataset>
      episode: 0
      from_row: 0
      until_row: 297              # 10/24 stage1_align.py와 같은 298행 — 랙 앞 도착

  - id: s1_align
    name: align_at_tube_rack
    executor: base_align
    terminator:
      type: timeout
      timeout_s: 60               # 하한 57초(max_moves 6 기준, preflight가 거부)
    align:
      reference_dataset: kiroaiseoul/test_replay_timing_1024
      episode: 0
      frame: 302                  # 데모 에피소드 0의 도착 화면
      camera: cam_high
      # 랙 상자 [x, y, w, h] — 기준 화면에서 dark_blob_box가 찾는 값과 같다
      # (10/24 데모로 확인). 이벤트의 auto_roi와 다르면 경고가 찍힌다
      landmark_roi: [285, 197, 93, 61]
      # 랙까지 거리. 10/24 오도메트리 접근 2표본에서 역산한 값(±10%)
      landmark_distance_m: 0.60
      yaw_tol_deg: 2.0
      dist_tol_cm: 1.0
      max_moves: 6
      # 정밀 추정(맞는 점 15개 미만·20° 초과)이 안 되면 랙 덩어리 위치로 대략
      # 돌린 뒤 다시 잰다 — 10/24 현장 루프와 같다. 대략 추정만으로는 정렬로
      # 끝나지 않는다. false = 정밀 추정이 안 되면 그 자리에서 실패
      coarse_heading: true

  - id: s2
    name: pickup_tubes
    executor: lerobot_policy
    policy_path: kiroaiseoul/pi0full_bs32_s30k_all11_14D
    instruction: "Pick up the two tubes from the rack with both hands"
    terminator:
      # 마지막 단계 — 오른쪽 화살표로 끝낸다(10/24 eval의 episode_time_s 120)
      type: manual
      timeout_s: 120.0
    precondition: null
    # 단계 2 앞의 수동 팔 맞추기(←, 리더암)를 대신한다. 그리퍼는 안 움직인다.
    # ⚠ 다시 만들 땐 손으로 고치지 말고 생성기로 — 체크포인트가 11단계 통합이라
    #   train_config.json의 데이터셋이 아니라 단계 2 데이터셋을 직접 준다:
    #   HF_HUB_OFFLINE=1 uv run python -m stage_runner.start_pose --stage s2=kiroaiseoul/pi0full_bs32_s30k_all11_14D \
    #     --dataset s2=kiroaiseoul/task02_pickup_tubes_14D \
    #     --dataset-root s2=$HOME/.cache/huggingface/lerobot/kiroaiseoul/task02_pickup_tubes_14D
    start_pose:
      # generated by `python -m stage_runner.start_pose` at 2026-10-24T22:48:21+09:00.
      # Regenerate instead of hand-editing: the values are episode 70's first frame.
      # Arm joints only -- the grippers and the base are never commanded by a start pose.
      positions:
        left_joint_0.pos: -0.06656748056411743
        left_joint_1.pos: 1.2827115058898926
        left_joint_2.pos: 0.6311513185501099
        left_joint_3.pos: 0.5308232307434082
        left_joint_4.pos: -0.1024261862039566
        left_joint_5.pos: 0.1504921019077301
        right_joint_0.pos: 0.13065537810325623
        right_joint_1.pos: 1.3025482892990112
        right_joint_2.pos: 0.613603413105011
        right_joint_3.pos: 0.5510414242744446
        right_joint_4.pos: -0.05054550990462303
        right_joint_5.pos: -0.056267641484737396
      min_goal_time_s: 3.0
      position_tolerance_rad: 0.05
      source:
        dataset_repo_id: "kiroaiseoul/task02_pickup_tubes_14D"
        dataset_revision: null
        dataset_commit: null
        policy_path: "kiroaiseoul/pi0full_bs32_s30k_all11_14D"
        episode_index: 70
        n_episodes: 133
        method: "first_frame_nearest_to_median_std_l2"
        distance: 1.7195268853888213
        # read from the local copy /home/jyoon/.cache/huggingface/lerobot/kiroaiseoul/task02_pickup_tubes_14D
