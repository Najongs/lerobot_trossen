[project]
name = "lerobot-trossen"
version = "0.1.0"
description = "Trossen Robotics LeRobot integration"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"

dependencies = [
  "lerobot_robot_trossen>=0.1.0",
  "lerobot_teleoperator_trossen>=0.1.0",
  "trossen-slate>=0.0.3",
  # cu128 wheels ship Volta (sm_70) only in torch 2.8.0-2.10.0.
  # 2.7.x never had it and 2.11.0 dropped it again (CuDNN 9.15.1).
  # This range is the only one covering V100, Ampere and Blackwell.
  "torch>=2.8,<2.11",
  "torchvision>=0.23,<0.26",
  # torchcodec is ABI-bound to torch but declares no torch dependency,
  # so the resolver cannot pair them. Official table: 0.10 <-> torch 2.10.
  # PyPI ships 0.10.0 (and later); its wheel links no NPP, so keep it
  # on PyPI rather than routing to the CUDA index.
  "torchcodec>=0.10,<0.11",
  "transformers>=4.53.3",
  "num2words>=0.5.14",
]

[project.optional-dependencies]
# pi0 (VLA) needs lerobot's peft extra and the fork of transformers that
# carries the PaliGemma/Gemma classes; base lerobot[intelrealsense] loads
# modeling_pi0 but silently lacks those classes.
pi0 = [
  "lerobot[peft]==0.4.4",
  "transformers",
  "scipy>=1.10.1,<1.15",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
lerobot_robot_trossen = { workspace = true }
lerobot_teleoperator_trossen = { workspace = true }
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
transformers = { git = "https://github.com/huggingface/transformers.git", branch = "fix/lerobot_openpi" }

[tool.uv]
# lerobot 0.4.4 declares transformers>=4.57.1, but pi0 requires the
# fix/lerobot_openpi fork which predates that. The conda recipe achieves
# the same by installing lerobot first and overwriting transformers after
# (pip warns and proceeds); uv resolves in one pass, so state it explicitly.
override-dependencies = ["transformers"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]

[tool.ruff.lint.isort]
combine-as-imports = true
