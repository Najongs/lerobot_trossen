# Hardware-free CHAIN config: same runner, same executors, same code path, mock
# robot and a mock policy. The counterpart of smoke_mock.yaml for config
# version 2.
#
# `stages:` is ABSENT on purpose -- a chain config that also listed stages is
# refused (the file would show one chain and the run would execute another).
# config.expand_chain builds them from the block below.
#
# dataset.root, output.root, chain.params_path and chain.model.policy_path are
# overridden by the test: LeRobotDataset.create() mkdirs its root with
# exist_ok=False, and the `progress` / `stuck` cases are the same file with a
# different policy.
#
# EVERY DURATION HERE IS SHRUNK so the 22-stage chain finishes in seconds.
# record_loop sleeps in REAL time, so the real p10/p90 (11.9 / 24.8 s for
# task01) would make one end-to-end run take half an hour. The numbers that are
# NOT shrunk -- the quintic's endpoints, the per-tick step bound, the window
# coverage rule -- are asserted as pure arithmetic in test_chain_unit.py, where
# the real 21 Hz / 1.5 s / 0.7 rad figures are used.

version: 2

robot:
  type: stage_runner_mock_robot
  id: chain_smoke
  joint_count: 14
  # The chain is keyed by joint NAME everywhere (reset targets, the completion
  # monitor, stage_params.json), so a flat joint_0..13 mock would miss every
  # lookup. See MockRobotConfig.realistic_joint_names.
  realistic_joint_names: true
  # false, like the real eval: the state is the 14 arm values and the base
  # slots are NOT fed to the policy. The action still carries x.vel / theta.vel.
  include_base_in_state: false

dataset:
  repo_id: local/eval_chain_mock
  # Must equal stage_params_mock.json's `fps`, or the loader refuses: the
  # quantiles are in seconds but the ramp's tick budget and the monitor's
  # windows come from the loop rate.
  fps: 21
  video: false

defaults:
  executor: chain_policy
  manual_ceiling_s: 5.0

output:
  root: /tmp/stage_runner_chain/outputs

chain:
  enabled: true
  params_path: packages/stage_runner/tests/data/stage_params_mock.json
  from_stage: 1
  to_stage: 11

  model:
    policy_path: mock://progress
    # null: a mock declares no 16+K state, so there is nothing for the one-hot
    # step to assert against and installing it would assert nothing. A mock
    # chain therefore exercises the stage sequence and the reset/completion
    # logic, NOT the one-hot wiring -- that is covered by the set_stage unit
    # test against the plugin file.
    onehot_k: null
    n_action_steps: null
    # REQUIRED for a mock path: with no checkpoint there is no action width to
    # read, and defaulting it would silently make the chain 16-D and degrade the
    # progress mock to `hold`.
    has_progress: true

  completion:
    p_done: 0.95
    p_hold_s: 0.2
    stall_s: 0.4
    stall_arm_rad: 0.05
    stall_base: 0.05
    timeout_factor: 1.3
    allow_manual_complete: true

  reset:
    t_min_s: 0.3
    v_des_rad_s: 0.524
    max_jump_rad: 1.5
    tol_rad: 0.05
    settle_s: 0.2
    ceiling_factor: 3.0
    settle_check_tries: 3
    settle_check_gap_s: 0.02
    settle_check_tol_rad: 0.02
    initial: true
